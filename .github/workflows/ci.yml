name: ci
on:
  push: { branches: [main] }
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: lode, POSTGRES_PASSWORD: lode, POSTGRES_DB: lode_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lode" --health-interval 2s --health-retries 30
    env:
      LODE_TEST_DSN: postgres://lode:lode@localhost:5432/lode_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make build
      - run: make test
      - uses: golangci/golangci-lint-action@v8
        with: { version: latest }

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: false
          breaking: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'buf skip breaking') }}
          breaking_against: ${{ github.event.repository.clone_url }}#branch=main
          push: false
          pr_comment: false

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make up
      - name: Wait for Adit and four veins
        run: |
          for i in $(seq 1 90); do
            curl -sf localhost:9090/metrics | grep -q '^lode_cluster_veins_available 4' && exit 0; sleep 1
          done
          docker compose -f deploy/docker-compose.yml logs; exit 1
      - name: aws CLI end-to-end
        run: make e2e
      - name: Corrupted nugget is never served
        run: make corruption
      - name: Same 1 GiB file uploaded twice is stored once
        run: DEDUP_SIZE_MB=1024 make dedup
      - name: Vein killed mid-upload; reads with any one vein down
        run: make replication
      - name: Chaos — kill a vein, corrupt another, heal with zero client errors
        run: make chaos
      - name: Metrics exported
        run: curl -sf localhost:9090/metrics | grep -E 'lode_adit_requests_total|lode_cluster_veins_available'
      - if: failure()
        run: docker compose -f deploy/docker-compose.yml logs adit vein1 vein2 vein3 vein4
      - if: always()
        run: make down

  s3compat:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: lode, POSTGRES_PASSWORD: lode, POSTGRES_DB: lode }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lode" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: make build
      - name: Start three veins and Adit
        env:
          LODE_LEDGER_DSN: postgres://lode:lode@localhost:5432/lode?sslmode=disable
        run: |
          for n in 1 2 3; do
            LODE_VEIN_ID=vein$n LODE_VEIN_LISTEN=127.0.0.1:700$n LODE_VEIN_ZONE=z$n LODE_VEIN_DATA_DIR=$RUNNER_TEMP/vein$n \
              LODE_METRICS_LISTEN=127.0.0.1:910$n nohup ./bin/lode-vein >"$RUNNER_TEMP/vein$n.log" 2>&1 &
          done
          nohup ./bin/lode-adit -config test/s3compat/adit.yaml >"$RUNNER_TEMP/adit.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf localhost:9090/metrics | grep -q '^lode_cluster_veins_available 3' && exit 0; sleep 1
          done
          cat "$RUNNER_TEMP"/*.log; exit 1
      - name: ceph/s3-tests subset
        run: make s3compat
      - if: failure()
        run: cat "$RUNNER_TEMP"/*.log
