version: "2"
linters:
  enable:
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      # Tests use AWS's published example credentials and test vectors.
      - path: _test\.go
        linters: [gosec]
formatters:
  enable:
    - gofmt
    - goimports
