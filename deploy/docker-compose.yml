name: lode

x-vein: &vein
  build:
    context: ..
    args: { BIN: lode-vein }
  environment: &vein-env
    LODE_LEDGER_DSN: postgres://lode:lode@postgres:5432/lode?sslmode=disable
    LODE_VEIN_LISTEN: ":7000"
    LODE_VEIN_DATA_DIR: /data
    LODE_LOG_FORMAT: text
    LODE_VEIN_SCRUB_PAUSE: 10s  # aggressive scrubbing for the dev cluster
    LODE_VEIN_SCRUB_RATE: "0"
  depends_on:
    postgres: { condition: service_healthy }

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lode
      POSTGRES_PASSWORD: lode
      POSTGRES_DB: lode
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lode"]
      interval: 2s
      retries: 30
    volumes: [pgdata:/var/lib/postgresql/data]

  # Six veins in two zones: replication 3 puts copies in both zones, and
  # erasure-coded buckets (e.g. 4+2) get one shard per vein.
  vein1:
    <<: *vein
    environment: { <<: *vein-env, LODE_VEIN_ID: vein1, LODE_VEIN_ADVERTISE: "vein1:7000", LODE_VEIN_ZONE: a, LODE_VEIN_HOST: vein1 }
    volumes: [vein1:/data]
  vein2:
    <<: *vein
    environment: { <<: *vein-env, LODE_VEIN_ID: vein2, LODE_VEIN_ADVERTISE: "vein2:7000", LODE_VEIN_ZONE: a, LODE_VEIN_HOST: vein2 }
    volumes: [vein2:/data]
  vein3:
    <<: *vein
    environment: { <<: *vein-env, LODE_VEIN_ID: vein3, LODE_VEIN_ADVERTISE: "vein3:7000", LODE_VEIN_ZONE: b, LODE_VEIN_HOST: vein3 }
    volumes: [vein3:/data]
  vein4:
    <<: *vein
    environment: { <<: *vein-env, LODE_VEIN_ID: vein4, LODE_VEIN_ADVERTISE: "vein4:7000", LODE_VEIN_ZONE: b, LODE_VEIN_HOST: vein4 }
    volumes: [vein4:/data]
  vein5:
    <<: *vein
    environment: { <<: *vein-env, LODE_VEIN_ID: vein5, LODE_VEIN_ADVERTISE: "vein5:7000", LODE_VEIN_ZONE: a, LODE_VEIN_HOST: vein5 }
    volumes: [vein5:/data]
  vein6:
    <<: *vein
    environment: { <<: *vein-env, LODE_VEIN_ID: vein6, LODE_VEIN_ADVERTISE: "vein6:7000", LODE_VEIN_ZONE: b, LODE_VEIN_HOST: vein6 }
    volumes: [vein6:/data]

  adit:
    build:
      context: ..
      args: { BIN: lode-adit }
    command: ["-config", "/etc/lode/adit.yaml"]
    volumes:
      - ./adit.example.yaml:/etc/lode/adit.yaml:ro
    environment:
      LODE_CANARY_DOWN_AFTER: 15s
      # Testing knobs (test/e2e/lifecycle.sh): skew the lifecycle clock.
      LODE_STRATA_CLOCK_OFFSET: ${LODE_STRATA_CLOCK_OFFSET:-0s}
      LODE_STRATA_INTERVAL: ${LODE_STRATA_INTERVAL:-1h}
      LODE_STRATA_TRANSITION_DELAY: ${LODE_STRATA_TRANSITION_DELAY:-10m}
    ports: ["9000:9000", "9090:9090"]
    depends_on:
      postgres: { condition: service_healthy }

  # MCP server for agents: streamable HTTP on :9100, read-only by default.
  # Clients send "Authorization: Bearer lode:lodesecret". Add -allow-write
  # to the command to enable drain_vein, set_quota and the other write tools.
  foreman:
    build:
      context: ..
      args: { BIN: lode-foreman }
    command: ["-config", "/etc/lode/adit.yaml", "-http", ":9100"]
    volumes:
      - ./adit.example.yaml:/etc/lode/adit.yaml:ro
    ports: ["9100:9100"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  vein1:
  vein2:
  vein3:
  vein4:
  vein5:
  vein6:
